<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>QA トリアージ</title>
<style>
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 48px 1fr; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #1f2937; color: #fff; }
  header .counts span { margin-right: 12px; }
  header button { background: #374151; color: #fff; border: 0; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  aside { overflow: auto; border-right: 1px solid #ddd; padding: 8px; font-size: 13px; }
  aside select, aside input { width: 100%; margin: 2px 0 8px; }
  #list div { padding: 4px 6px; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; }
  #list div.cur { background: #dbeafe; }
  main { overflow: auto; padding: 16px 24px; }
  .chip { display: inline-block; padding: 2px 8px; margin: 2px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 15px; }
  .chip.target { border-color: #dc2626; color: #dc2626; text-decoration: line-through; background: #fef2f2; }
  .chip.add { border-color: #16a34a; color: #166534; background: #f0fdf4; }
  .finding { border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; margin: 10px 0; }
  .finding.approved { border-color: #16a34a; background: #f0fdf4; }
  .finding.rejected { border-color: #9ca3af; background: #f9fafb; opacity: .7; }
  .finding.applied { border-color: #9ca3af; background: #f3f4f6; opacity: .6; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; background: #e5e7eb; }
  .badge.sig { background: #fef3c7; }
  .badge.sig.stale { background: #fecaca; }
  .badge.high { background: #fecaca; } .badge.medium { background: #fde68a; } .badge.low { background: #e5e7eb; }
  .keys { color: #6b7280; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <strong>QA トリアージ</strong>
  <div class="counts" id="counts"></div>
  <button id="bulkApprove">表示中を一括承認</button>
  <button id="bulkReject">表示中を一括却下</button>
</header>
<aside>
  <label>status <select id="fStatus"><option value="pending">pending</option><option value="approved">approved</option><option value="rejected">rejected</option><option value="">all</option></select></label>
  <label>check <select id="fCheck"><option value="">all</option></select></label>
  <label>confidence <select id="fConf"><option value="">all</option><option>high</option><option>medium</option><option>low</option></select></label>
  <label>action <select id="fAction"><option value="">all</option></select></label>
  <label>file <select id="fFile"><option value="">all</option></select></label>
  <label>signal <select id="fSig"><option value="">all</option><option value="dup_elsewhere">dup_elsewhere</option><option value="suffix_rule">suffix_rule</option><option value="fix_reading_dup">fix_reading_dup</option><option value="value_not_in_row">value_not_in_row</option><option value="entry_stale">entry_stale</option><option value="source_support">source_support</option><option value="none">なし</option></select></label>
  <div id="listCount"></div>
  <div id="list"></div>
</aside>
<main id="main"></main>
<script>
let items = [], rows = [], cur = 0, undo = [], busy = false;
const DECIDABLE = ['pending', 'approved', 'rejected'];
const DECIDE_KEYS = ['a', 'r', 's', 'u'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SIG_LABEL = s => {
  switch (s.type) {
    case 'dup_elsewhere': return `「${s.kanji}」は別読み行にも存在: ${s.readings.join('・')}`;
    case 'suffix_rule': return `「${s.kanji}」の接尾辞「${s.suffix}」は通常「${s.expected}」読み`;
    case 'fix_reading_dup': return '提案読みは既存行と重複';
    case 'value_not_in_row': return `対象漢字が行に無い: ${s.kanji.join('・')}`;
    case 'entry_stale': return s.current ? `entry が現行行と不一致（現行: ${s.current}）` : 'entry が現行行に無い（同キー行なし/複数）';
    case 'source_support': return `根拠 ${s.kanji}: NDL ${s.ndl}人 / Wikidata ${s.wikidata}人 / JMnedict ${s.jmnedict ? '✓' : '-'}`;
    default: return s.type;
  }
};

async function load() {
  const r = await fetch('/api/items'); const body = await r.json();
  items = body.items; renderCounts(body.counts); fillFilters(); apply();
}
function renderCounts(c) {
  $('counts').innerHTML = ['pending','approved','rejected','applied'].map(k => `<span>${k}: <b>${c[k]||0}</b></span>`).join('');
}
function fillFilters() {
  const uniq = (k) => [...new Set(items.map(i => k(i)))].sort();
  for (const [id, f] of [['fCheck', i => i.check], ['fAction', i => i.proposed_fix.action], ['fFile', i => i.file]]) {
    const sel = $(id); for (const v of uniq(f)) { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); }
  }
}
function filtered() {
  const st = $('fStatus').value, ck = $('fCheck').value, cf = $('fConf').value, ac = $('fAction').value, fl = $('fFile').value, sg = $('fSig').value;
  return items.filter(i => (!st || i.status === st) && (!ck || i.check === ck) && (!cf || i.confidence === cf)
    && (!ac || i.proposed_fix.action === ac) && (!fl || i.file === fl)
    && (!sg || (sg === 'none' ? i.signals.length === 0 : i.signals.some(s => s.type === sg))));
}
function apply() {
  const f = filtered(); const map = new Map();
  for (const i of f) { const key = i.file + '|' + i.entry; if (!map.has(key)) map.set(key, []); map.get(key).push(i); }
  rows = [...map.values()]; cur = Math.max(0, Math.min(cur, rows.length - 1));
  $('listCount').textContent = `${f.length} 件 / ${rows.length} 行`;
  $('list').innerHTML = rows.map((g, n) => `<div class="${n === cur ? 'cur' : ''}" data-n="${n}"><span>${esc(g[0].row.reading)}</span><span>${g.length}件 ${g.some(i => i.signals.length) ? '⚑' : ''}</span></div>`).join('');
  $('list').querySelectorAll('div').forEach(d => d.onclick = () => { cur = +d.dataset.n; apply(); });
  renderMain();
}
function renderMain() {
  const g = rows[cur]; if (!g) { $('main').innerHTML = '<p>表示する行がありません。</p>'; return; }
  const row = g[0].row, targets = new Set(g.flatMap(i => i.targets));
  const isAddRow = g[0].proposed_fix.action === 'add_row';
  const addKanji = g.flatMap(i => i.proposed_fix.action === 'add_kanji'
    ? String(i.proposed_fix.value || '').split(/[,、]/).map(s => s.trim()).filter(Boolean) : []);
  const chips = row.kanji.map(k => `<span class="chip ${isAddRow ? 'add' : (targets.has(k) ? 'target' : '')}">${esc(k)}</span>`).join('')
    + addKanji.map(k => `<span class="chip add">${esc(k)}</span>`).join('');
  const findings = g.map(i => `<div class="finding ${esc(i.status)}">
      <span class="badge ${esc(i.confidence)}">${esc(i.confidence)}</span><span class="badge">${esc(i.check)}</span>
      <span class="badge">${esc(i.proposed_fix.action)} ${esc(i.proposed_fix.value || '')}</span><span class="badge">${esc(i.status)}</span>
      ${i.signals.map(s => `<span class="badge sig ${s.type === 'entry_stale' ? 'stale' : ''}">⚑ ${esc(SIG_LABEL(s))}</span>`).join('')}
      <p>${esc(i.evidence)}</p><a href="${esc(i.search_url)}" target="_blank" rel="noopener">検索</a></div>`).join('');
  const decidable = g.filter(i => DECIDABLE.includes(i.status)).length;
  $('main').innerHTML = `<h2>${esc(row.reading)} <small>${esc(row.romaji)}${row.population ? ' / ' + esc(row.population) + '人' : ''}</small> <small>${esc(g[0].file)}</small>${isAddRow ? ' <span class="badge">追加行</span>' : ''}</h2>
    <div>${chips}</div>${findings}
    <div class="keys">a=承認 r=却下 s=保留 u=取り消し j/k=次/前 （この行の ${decidable} 件に適用${decidable < g.length ? '、applied は対象外' : ''}）</div>`;
  const el = $('list').children[cur]; if (el) el.scrollIntoView({ block: 'nearest' });
}
// 判断を送信して items に反映する。成功なら true。失敗時は alert して false（items は変更しない）。
async function decide(ids, status, remember = true) {
  const prevEntries = remember ? ids.map(id => ({ id, prev: items.find(i => i.id === id).status })) : null;
  let r;
  try {
    r = await fetch('/api/decide', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids, status }) });
  } catch (e) { alert('通信エラー: ' + e); return false; }
  if (!r.ok) { alert('エラー: ' + (await r.text())); return false; }
  if (remember) undo.push(prevEntries);
  const body = await r.json(); renderCounts(body.counts);
  for (const i of items) if (ids.includes(i.id)) i.status = status;
  return true;
}
// decide 実行中の連打・キーリピートによる二重送信を防ぐ。
async function withBusy(fn) {
  if (busy) return;
  busy = true;
  try { await fn(); } finally { busy = false; }
}
async function decideRow(status) {
  const g = rows[cur]; if (!g) return;
  const ids = g.filter(i => DECIDABLE.includes(i.status)).map(i => i.id); if (!ids.length) return;
  await withBusy(() => decide(ids, status));
  apply();
}
async function undoLast() {
  const last = undo.pop(); if (!last) return;
  await withBusy(async () => {
    // prev status ごとにまとめて 1 回ずつ POST する。
    const byPrev = new Map();
    for (const { id, prev } of last) { if (!byPrev.has(prev)) byPrev.set(prev, []); byPrev.get(prev).push(id); }
    const groups = [...byPrev.entries()];
    for (let n = 0; n < groups.length; n++) {
      const [prev, ids] = groups[n];
      if (!(await decide(ids, prev, false))) {
        // 失敗した分は取り消し履歴に戻して再試行できるようにする。
        undo.push(groups.slice(n).flatMap(([p, is]) => is.map(id => ({ id, prev: p }))));
        break;
      }
    }
  });
  apply();
}
async function bulk(status) {
  const f = filtered().filter(i => DECIDABLE.includes(i.status)); if (!f.length) return;
  if (!confirm(`表示中の ${f.length} 件を ${status} にします（applied は対象外）。よろしいですか？`)) return;
  await withBusy(() => decide(f.map(i => i.id), status));
  apply();
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (DECIDE_KEYS.includes(e.key) && busy) return;
  if (e.key === 'a') decideRow('approved'); else if (e.key === 'r') decideRow('rejected'); else if (e.key === 's') decideRow('pending');
  else if (e.key === 'u') undoLast(); else if (e.key === 'j') { if (rows.length) { cur = Math.min(cur + 1, rows.length - 1); apply(); } }
  else if (e.key === 'k') { if (rows.length) { cur = Math.max(cur - 1, 0); apply(); } }
});
for (const id of ['fStatus', 'fCheck', 'fConf', 'fAction', 'fFile', 'fSig']) $(id).onchange = () => { cur = 0; apply(); };
$('bulkApprove').onclick = () => bulk('approved'); $('bulkReject').onclick = () => bulk('rejected');
load();
</script>
</body>
</html>
